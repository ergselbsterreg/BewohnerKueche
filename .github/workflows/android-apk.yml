name: Android APK bauen

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP entpacken
        run: unzip -q BewohnerKueche_AndroidStudio.zip

      - name: APK bauen
        run: |
          cd BewohnerKueche
          gradle assembleDebug

      - name: APK speichern
        uses: actions/upload-artifact@v4
        with:
          name: BewohnerKueche-APK
          path: BewohnerKueche/app/build/outputs/apk/debug/app-debug.apk
